<!DOCTYPE html>
<!-- HTML
  Planejamento Orçamentário — Prefeitura Municipal de Botucatu
  Documento-casca (shell) da SPA. Todo conteúdo dinâmico é renderizado pelas
  views em js/ui/views/*. Nenhum CSS ou JS inline: ver css/ e js/.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ferramenta de Planejamento Orçamentário Público — Prefeitura Municipal de Botucatu">
  <title>Planejamento Orçamentário — Botucatu</title>
  <link rel="icon" type="image/png" href="assets/img/brasao-botucatu.png">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/print.css" media="print">

  <!-- JAVASCRIPT — carregados no <head> de propósito: o tema (claro/escuro) precisa
       ser aplicado antes da primeira pintura para a tela não piscar. -->
  <script src="js/core/namespace.js"></script>
  <script src="js/ui/tema.js"></script>
</head>
<body class="app">
  <a class="app__skip-link" href="#conteudo" data-testid="link-pular-conteudo">Pular para o conteúdo</a>

  <!-- Cabeçalho global: identidade, seletor de exercício e versão -->
  <header class="app-header" role="banner">
    <button class="app-header__menu-toggle" type="button" aria-controls="navegacao" aria-expanded="false"
            data-testid="btn-menu-toggle">
      <span class="app-header__menu-icon" aria-hidden="true"></span>
      <span class="u-visually-hidden">Mostrar ou recolher o menu</span>
    </button>
    <div class="app-header__brand">
      <img class="app-header__logo" src="assets/img/brasao-botucatu.png" alt="Brasão da Prefeitura Municipal de Botucatu"
           width="229" height="250" data-testid="img-logo-header">
      <div class="app-header__brand-text">
        <h1 class="app-header__title">Planejamento Orçamentário</h1>
        <p class="app-header__subtitle">Prefeitura Municipal de Botucatu</p>
      </div>
    </div>
    <div class="app-header__tools">
      <label class="app-header__label" for="seletor-exercicio">Exercício</label>
      <select class="app-header__select" id="seletor-exercicio" data-testid="select-exercicio"></select>
      <button class="app-header__button" type="button" id="btn-novo-exercicio" data-testid="btn-novo-exercicio"
              title="Cadastrar novo exercício" aria-label="Cadastrar novo exercício">+</button>
      <!-- Alternância claro/escuro: estado em aria-pressed (ligado por js/ui/tema.js) -->
      <button class="app-header__button app-header__button--tema" type="button" id="btn-modo-escuro"
              data-testid="btn-modo-escuro" aria-pressed="false" title="Alternar modo escuro">
        <span class="app-header__tema-icone" aria-hidden="true"></span>
        <span class="app-header__tema-texto">Modo escuro</span>
      </button>
      <span class="app-header__version" data-testid="txt-versao" id="versao-app"></span>
    </div>
  </header>

  <!-- Cabeçalho institucional exclusivo da impressão (oculto na tela, exibido por css/print.css):
       garante o brasão em todo relatório impresso — Relatórios Gerenciais, Secretarias e Gráficos -->
  <div class="print-header" data-testid="cabecalho-impressao">
    <img class="print-header__logo" src="assets/img/brasao-botucatu.png" alt="Brasão da Prefeitura Municipal de Botucatu"
         width="229" height="250">
    <div class="print-header__text">
      <p class="print-header__org">Prefeitura Municipal de Botucatu</p>
      <p class="print-header__system">Planejamento Orçamentário</p>
    </div>
  </div>

  <div class="app__body">
    <!-- Navegação principal: preenchida por js/ui/navegacao.js a partir de js/core/config.js -->
    <nav class="app-nav" id="navegacao" aria-label="Navegação principal" data-testid="nav-principal"></nav>

    <!-- Área de conteúdo: o roteador injeta a view ativa aqui -->
    <main class="app-main" id="conteudo" tabindex="-1" data-testid="area-conteudo"></main>
  </div>

  <footer class="app-footer" role="contentinfo">
    <p class="app-footer__text">
      Dados armazenados localmente neste navegador (IndexedDB). Base normativa: CF/88 arts. 165–169,
      LC 101/2000, Lei 4.320/64, Lei 14.133/21, MCASP/MTO.
    </p>
  </footer>

  <!-- Região de notificações acessível (toasts) -->
  <div class="toast-region" id="notificacoes" aria-live="polite" aria-atomic="false" data-testid="regiao-notificacoes"></div>

  <!-- JAVASCRIPT — scripts clássicos (funcionam via file:// sem servidor), ordem importa:
       núcleo → domínio → dados → importadores → UI → bootstrap
       (namespace.js e ui/tema.js já foram carregados no <head>) -->
  <script src="js/core/config.js"></script>
  <script src="js/core/texto.js"></script>
  <script src="js/core/dinheiro.js"></script>
  <script src="js/core/eventos.js"></script>
  <script src="js/core/estado.js"></script>
  <script src="js/core/dom.js"></script>
  <script src="js/core/vendor-loader.js"></script>

  <script src="js/domain/periodos.js"></script>
  <script src="js/domain/classificacao-despesa.js"></script>
  <script src="js/domain/classificacao-receita.js"></script>
  <script src="js/domain/ajustes-despesa.js"></script>
  <script src="js/domain/composicao-receita.js"></script>

  <script src="js/data/db.js"></script>
  <script src="js/data/repositorio.js"></script>

  <script src="js/importers/csv-parser.js"></script>
  <script src="js/importers/leitor-planilha.js"></script>
  <script src="js/importers/mapeador-despesas.js"></script>
  <script src="js/importers/mapeador-receitas.js"></script>
  <script src="js/importers/importador.js"></script>

  <script src="js/ui/notificador.js"></script>
  <script src="js/ui/componentes.js"></script>
  <script src="js/ui/roteador.js"></script>
  <script src="js/ui/navegacao.js"></script>
  <script src="js/ui/graficos.js"></script>
  <script src="js/ui/relatorio-projecao.js"></script>
  <script src="js/ui/formulario-dotacao.js"></script>
  <script src="js/ui/views/painel.js"></script>
  <script src="js/ui/views/graficos.js"></script>
  <script src="js/ui/views/secretaria.js"></script>
  <script src="js/ui/views/receitas.js"></script>
  <script src="js/ui/views/importar.js"></script>
  <script src="js/ui/views/relatorios.js"></script>
  <script src="js/ui/views/exportar.js"></script>
  <script src="js/ui/views/nao-encontrado.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
